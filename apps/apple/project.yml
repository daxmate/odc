name: ODict
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  ODictKit:
    path: ODictKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
schemes:
  ODict:
    build:
      targets:
        ODict: all
    run:
      config: Debug
    archive:
      config: Release
  ODictDesktop:
    build:
      targets:
        ODictDesktop: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  ODict:
    type: application
    platform: iOS
    sources:
      - path: ODict
      - path: Shared
    dependencies:
      - package: ODictKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.odict
        PRODUCT_NAME: ODict
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: ODict/Info.plist
      properties:
        CFBundleDisplayName: ODict
        CFBundleShortVersionString: "0.15.0"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.daxmate.odict.dictionary
            UTTypeDescription: ODC Dictionary
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - odc
        CFBundleDocumentTypes:
          - CFBundleTypeName: ODC Dictionary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.daxmate.odict.dictionary
  ODictDesktop:
    type: application
    platform: macOS
    sources:
      - path: ODictDesktop
      - path: Shared
    dependencies:
      - package: ODictKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.odict.desktop
        PRODUCT_NAME: ODict Desktop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDesktop
        CODE_SIGN_ENTITLEMENTS: ODictDesktop/ODictDesktop.entitlements
    info:
      path: ODictDesktop/Info.plist
      properties:
        CFBundleDisplayName: ODict Desktop
        CFBundleShortVersionString: "0.15.0"
        CFBundleVersion: "16"
        LSApplicationCategoryType: public.app-category.reference
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.daxmate.odict.dictionary
            UTTypeDescription: ODC Dictionary
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - odc
        CFBundleDocumentTypes:
          - CFBundleTypeName: ODC Dictionary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.daxmate.odict.dictionary
