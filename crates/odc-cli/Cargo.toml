[package]
name = "odc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for the Open Dictionary Container format"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "odc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
odc-core = { path = "../odc-core", version = "0.14.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
odc-testkit = { path = "../odc-testkit" }
rusqlite = { version = "0.41.1", features = ["blob", "bundled"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
